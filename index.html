          content="10道题测测你的边界感，看看你在人际关系中是否容易过度迁就别人。">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                "PingFang SC",
                "Hiragino Sans GB",
                "Microsoft YaHei",
                sans-serif;
            background: #f7f5f1;
            color: #333;
        }

        .container {
            width: 100%;
            max-width: 620px;
            margin: 0 auto;
            padding: 24px 18px 50px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            padding: 28px 22px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        /* 首页 */

        .intro {
            text-align: center;
            padding: 20px 5px;
        }

        .emoji {
            font-size: 54px;
            margin-bottom: 12px;
        }

        h1 {
            font-size: 27px;
            margin: 10px 0 14px;
            line-height: 1.4;
        }

        .subtitle {
            color: #777;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 28px;
        }

        .notice {
            background: #f8f6f2;
            border-radius: 12px;
            padding: 14px;
            color: #777;
            font-size: 13px;
            line-height: 1.7;
            text-align: left;
            margin-bottom: 24px;
        }

        button {
            border: none;
            cursor: pointer;
            font-family: inherit;
        }

        .start-btn,
        .next-btn,
        .restart-btn {
            width: 100%;
            background: #333;
            color: #fff;
            border-radius: 12px;
            padding: 15px;
            font-size: 16px;
            transition: 0.2s;
        }

        .start-btn:hover,
        .next-btn:hover,
        .restart-btn:hover {
            opacity: 0.88;
            transform: translateY(-1px);
        }

        /* 测试页面 */

        .progress-area {
            margin-bottom: 24px;
        }

        .progress-text {
            display: flex;
            justify-content: space-between;
            color: #888;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .progress {
            width: 100%;
            height: 7px;
            background: #eee;
            border-radius: 10px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0;
            background: #333;
            transition: width 0.3s ease;
        }

        .question {
            font-size: 20px;
            font-weight: 600;

        }

        .option {
            width: 100%;
            background: #fafafa;
            border: 1px solid #e8e8e8;
            border-radius: 12px;
            padding: 15px;
            text-align: left;
            margin-bottom: 12px;
            font-size: 15px;
            line-height: 1.5;
            color: #333;
            transition: 0.2s;
        }

        .option:hover {
            background: #f1f1f1;
        }

        .option.selected {
            border-color: #333;
            background: #f0eee9;
        }

        /* 结果页面 */

        .result {
            text-align: center;
        }

        .result-icon {
            font-size: 58px;
            margin-bottom: 8px;
        }

        .score {
            font-size: 46px;
            font-weight: 700;
            margin: 4px 0;
        }

        .score-label {
            color: #888;
            font-size: 14px;
            margin-bottom: 20px;
        }

        .result-title {
            font-size: 25px;
            font-weight: 700;
            margin-bottom: 14px;
        }

        .result-desc {
            text-align: left;
            background: #f8f6f2;
            padding: 18px;
            border-radius: 14px;
            line-height: 1.8;
            font-size: 15px;
            margin-bottom: 22px;
        }

        .advice {
            text-align: left;
            margin-bottom: 26px;
        }

        .advice h3 {
            font-size: 17px;
            margin-bottom: 10px;
        }

        .advice ul {
            margin: 0;
            padding-left: 20px;
            color: #555;
            line-height: 1.9;
            font-size: 14px;
        }

        .footer {
            text-align: center;
            color: #aaa;
            font-size: 12px;
            margin-top: 20px;
            line-height: 1.7;
        }

        .hidden {
            display: none;
        }

        @media (max-width: 480px) {
            .container {
                padding: 12px 12px 40px;
            }

            .card {
                border-radius: 18px;
                padding: 24px 18px;
            }

            h1 {
                font-size: 24px;
            }

            .question {
                font-size: 18px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- 首页 -->
    <div id="startPage" class="card">

        <div class="intro">

            <div class="emoji">🌿</div>

            <h1>你的边界感指数有多高？</h1>

            <div class="subtitle">
                10道题，看看你在人际关系中<br>
                是更容易坚持自己，还是习惯迁就别人。
            </div>

            <div class="notice">
                测试大约需要2分钟。<br>
                没有标准答案，请选择最接近你真实状态的选项。
                <br><br>
                本测试仅用于自我探索与娱乐，不构成心理诊断或医学建议。
            </div>

            <button class="start-btn" onclick="startTest()">
                开始测试
            </button>

        </div>

    </div>


    <!-- 测试页面 -->
    <div id="testPage" class="card hidden">

        <div class="progress-area">

            <div class="progress-text">
                <span id="questionNumber">第 1 / 10 题</span>
                <span id="progressPercent">10%</span>
            </div>

            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>

        </div>

        <div id="questionText" class="question"></div>

        <div id="options"></div>

        <button
            id="nextBtn"
            class="next-btn"
            onclick="nextQuestion()"
            disabled>
            下一题
        </button>

    </div>


    <!-- 结果页面 -->
    <div id="resultPage" class="card hidden">

        <div class="result">

            <div id="resultIcon" class="result-icon">
                🌿
            </div>

            <div id="score" class="score">
                0
            </div>

            <div class="score-label">
                你的边界感指数
            </div>

            <div id="resultTitle" class="result-title">
                测试结果
            </div>

            <div id="resultDesc" class="result-desc">
            </div>

            <div class="advice">

                <h3>给你3个小建议</h3>

                <ul id="adviceList"></ul>

            </div>

            <button
                class="restart-btn"
                onclick="restartTest()">
                再测一次
            </button>

        </div>

    </div>


    <div class="footer">
        本测试仅用于自我探索与娱乐，不构成心理诊断。<br>
        © 2026 趣味测试
    </div>

</div>


<script>

    /*
     * ==========================
     * 测试题目
     * ==========================
     *
     * 每个选项对应一个分数：
     *
     * 0 = 边界感较强
     * 1 = 偶尔会迁就
     * 2 = 比较容易迁就
     * 3 = 很容易忽略自己的感受
     */

    const questions = [

        {
            question: "朋友临时找你帮忙，但你今天其实很累，你会？",
            options: [
                { text: "直接说今天不方便", score: 0 },
                { text: "看事情大小，小事可能会帮", score: 1 },
                { text: "虽然不太想，但大概率还是会答应", score: 2 },
                { text: "不好意思拒绝，再累也会帮", score: 3 }
            ]
        },

        {
            question: "别人对你提出一个让你不舒服的要求，你通常会？",
            options: [
                { text: "明确告诉对方我不接受", score: 0 },
                { text: "先考虑一下，再决定", score: 1 },
                { text: "担心关系受到影响，所以尽量答应", score: 2 },
                { text: "几乎不会拒绝，怕对方不高兴", score: 3 }
            ]
        },

        {
            question: "别人突然对你冷淡，你第一反应是什么？",
            options: [
                { text: "可能只是对方自己的事情", score: 0 },
                { text: "会想一下是不是发生了什么", score: 1 },
                { text: "会反思自己是不是哪里做错了", score: 2 },
                { text: "很焦虑，马上想办法修复关系", score: 3 }
            ]
        },

        {
            question: "和别人发生意见不合时，你通常？",
            options: [
                { text: "可以表达不同意见", score: 0 },
                { text: "看关系和事情重要程度", score: 1 },
                { text: "通常会先妥协", score: 2 },
                { text: "尽量避免冲突，哪怕委屈自己", score: 3 }
            ]
        },

        {
            question: "别人向你倾诉负面情绪，你会？",
            options: [
                { text: "倾听，但知道那不是我的责任", score: 0 },
                { text: "会陪伴对方一会儿", score: 1 },
                { text: "很容易被对方的情绪影响", score: 2 },
                { text: "觉得自己必须帮对方解决问题", score: 3 }
            ]
        },

        {
            question: "你答应了一件事，后来发现自己其实不想做，你会？",
            options: [
                { text: "重新和对方沟通", score: 0 },
                { text: "如果影响不大，就继续做完", score: 1 },
                { text: "虽然不舒服，但还是会做", score: 2 },
                { text: "觉得既然答应了，就必须坚持到底", score: 3 }
            ]
        },

        {
            question: "别人批评你时，即使你觉得对方说得不对，你会？",
            options: [
                { text: "听听对方的理由，再判断", score: 0 },
                { text: "会有点在意，但不会太久", score: 1 },
                { text: "反复想自己是不是做错了", score: 2 },
                { text: "很难受，会不断反省自己", score: 3 }
            ]
        },

        {
            question: "家人不喜欢你的某个决定，你通常？",
            options: [
                { text: "解释自己的想法，然后自己决定", score: 0 },
                { text: "会认真听听家人的意见", score: 1 },
                { text: "很容易因为家人的反对而改变", score: 2 },
                { text: "只要家人不高兴，我就会觉得自己做错了", score: 3 }
            ]
        },

        {
            question: "你一个人休息的时候，会不会觉得自己应该去做点什么？",
            options: [
                { text: "不会，休息就是休息", score: 0 },
                { text: "偶尔会有这种感觉", score: 1 },
                { text: "经常觉得自己还有很多事情没完成", score: 2 },
                { text: "即使休息也会有明显的愧疚感", score: 3 }
            ]
        },

        {
            question: "当你发现自己一直在迁就别人时，你通常？",
            options: [
                { text: "会及时调整", score: 0 },
                { text: "偶尔意识到后会调整", score: 1 },
                { text: "知道自己委屈，但很难改变", score: 2 },
                { text: "明明很累，却不知道怎么拒绝", score: 3 }
            ]
        }

    ];


    let currentQuestion = 0;
    let totalScore = 0;
    let selectedScore = null;


    /*
     * 开始测试
     */

    function startTest() {

        currentQuestion = 0;
        totalScore = 0;

        document
            .getElementById("startPage")
            .classList.add("hidden");

        document
            .getElementById("resultPage")
            .classList.add("hidden");

        document
            .getElementById("testPage")
            .classList.remove("hidden");

        showQuestion();

    }


    /*
     * 显示题目
     */

    function showQuestion() {

        const question = questions[currentQuestion];

        selectedScore = null;

        const number = currentQuestion + 1;
        const percent =
            Math.round(number / questions.length * 100);

        document.getElementById("questionNumber").innerText =
            `第 ${number} / ${questions.length} 题`;

        document.getElementById("progressPercent").innerText =
            `${percent}%`;

        document.getElementById("progressBar").style.width =
            `${percent}%`;

        document.getElementById("questionText").innerText =
            question.question;


        const optionsContainer =
            document.getElementById("options");

        optionsContainer.innerHTML = "";


        question.options.forEach((option, index) => {

            const button =
                document.createElement("button");

            button.className = "option";

            button.innerText = option.text;

            button.onclick = function () {

                document
                    .querySelectorAll(".option")
                    .forEach(btn => {
                        btn.classList.remove("selected");
                    });

                button.classList.add("selected");

                selectedScore = option.score;

                document.getElementById("nextBtn").disabled = false;

            };

            optionsContainer.appendChild(button);

        });


        const nextBtn =
            document.getElementById("nextBtn");

        nextBtn.disabled = true;

        if (currentQuestion === questions.length - 1) {
            nextBtn.innerText = "查看测试结果";
        } else {
            nextBtn.innerText = "下一题";
        }

    }


    /*
     * 下一题
     */

    function nextQuestion() {

        if (selectedScore === null) {
            return;
        }

        totalScore += selectedScore;

        currentQuestion++;

        if (currentQuestion >= questions.length) {

            showResult();

        } else {

            showQuestion();

        }

    }


    /*
     * 显示结果
     */

    function showResult() {

        document
            .getElementById("testPage")
            .classList.add("hidden");

        document
            .getElementById("resultPage")
            .classList.remove("hidden");


        document.getElementById("score").innerText =
            totalScore;


        let title = "";
        let desc = "";
        let icon = "";
        let advice = [];


        /*
         * 最高分30
         */

        if (totalScore <= 7) {

            icon = "🌱";

            title = "你的边界感比较强";

            desc =
                "你通常能够分清自己的责任和别人的责任。" +
                "面对不合理的要求，你比较有能力表达拒绝。" +
                "你并不是完全不在意别人的感受，而是知道照顾别人之前，" +
                "也需要照顾自己的感受。";

            advice = [
                "继续保持清晰的自我边界。",
                "拒绝别人不代表你是一个自私的人。",
                "同时也可以允许自己偶尔接受别人的帮助。"
            ];

        }

        else if (totalScore <= 15) {

            icon = "🌿";

            title = "你的边界感比较平衡";

            desc =
                "大多数时候你能够照顾自己的感受，" +
                "但遇到重要的人或比较大的冲突时，" +
                "你偶尔还是会选择迁就。这样的状态并不一定是坏事，" +
                "真正需要注意的是：迁就是否变成了长期委屈自己。";

            advice = [
                "注意那些让你反复感到疲惫的关系。",
                "学会区分“我愿意做”和“我觉得我应该做”。",
                "拒绝之前不需要先证明自己有多辛苦。"
            ];

        }

        else if (totalScore <= 23) {

            icon = "🍃";

            title = "你可能有些容易过度迁就";

            desc =
                "你比较在意别人的感受，也容易把别人的需求放在自己前面。" +
                "有时候你明明不舒服，却还是会告诉自己“算了”。" +
                "久而久之，别人可能觉得这是你的习惯，而你自己却越来越累。";

            advice = [
                "从小事开始练习说“不”。",
                "别人不高兴，不一定意味着你做错了。",
                "在答应别人之前，先问自己：我是真的愿意吗？"
            ];

        }

        else {

            icon = "🌳";

            title = "你可能承担了太多不属于你的责任";

            desc =
                "你很容易把别人的情绪、期待甚至问题，" +
                "也变成自己的责任。你可能非常害怕让别人失望，" +
                "所以经常选择委屈自己来维持关系。" +
                "长期如此，很容易产生疲惫、压抑和情绪内耗。";

            advice = [
                "先练习接受别人偶尔的不高兴。",
                "提醒自己：帮助别人是一种选择，不是一项义务。",
                "当你想答应一件事时，给自己10秒钟再回答。"
            ];

        }


        document.getElementById("resultIcon").innerText =
            icon;

        document.getElementById("resultTitle").innerText =
            title;

        document.getElementById("resultDesc").innerText =
            desc;


        const adviceList =
            document.getElementById("adviceList");

        adviceList.innerHTML = "";

        advice.forEach(item => {

            const li =
                document.createElement("li");

            li.innerText = item;

            adviceList.appendChild(li);

        });

    }


    /*
     * 重新测试
     */

    function restartTest() {

        document
            .getElementById("resultPage")
            .classList.add("hidden");

        document
            .getElementById("startPage")
            .classList.remove("hidden");

    }

</script>

</body>
</html>
```
